server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Share links are /s/<id>#key — the id lives in the path and the key in
    # the fragment (never sent to any server). There is no per-id file to
    # serve: every /s/* URL renders the decrypt page, whose JS reads the id
    # from location.pathname and the key from location.hash.
    location /s/ {
        try_files /decrypt/index.html =404;
    }

    # Hashed build assets are immutable — cache hard.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
