version: 2

# Only the CLI is released as a binary. The server links SQLite through cgo
# (mattn/go-sqlite3), so a CGO_ENABLED=0 cross-compile produces a binary that
# crashes on first database open. It ships as a Docker image instead — see
# deploy/Dockerfile, which builds it with CGO_ENABLED=1.

builds:
  - id: cli
    main: ./cmd/kip/
    binary: kip
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - id: cli
    ids:
      - cli
    name_template: "kip_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: kipenv
    name: kip
