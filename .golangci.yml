version: "2"
linters:
  enable:
    - bodyclose
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - noctx
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G104
    govet:
      enable-all: true
      disable:
        # Struct field ordering saves a handful of bytes per instance. This is a
        # CLI and a low-traffic API — clarity of field grouping wins.
        - fieldalignment
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: unused-parameter
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # Tests build requests with httptest.NewRequest and talk to httptest
      # servers; threading a context through them adds noise, not safety.
      # errcheck/errorlint: a test's error handling is failing the test.
      # gosec G101: the secret scanner's fixtures are, by necessity, secrets.
      - path: _test\.go
        linters:
          - noctx
          - errcheck
          - errorlint
          - gosec
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
